[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pssc"
dynamic = ["version"]
description = "PSSC — the PSS compiler: PSS source to SystemVerilog, C, and Python via Zuspec IR"
authors = [
  { name = "Matthew Ballance", email = "matt.ballance@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
  "pssparser",
  "zuspec-ir-core",
  "zuspec-dataclasses",
  "zuspec-be-sv",
  "zuspec-be-sw",
]

[project.scripts]
pssc = "pssc.cli:main"

[tool.setuptools.dynamic]
version = {attr = "pssc.__version__.version"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pssc = ["std_libs/*.pss", "share/sv/*.sv"]
